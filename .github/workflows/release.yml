name: Release

# Publishes linework-mcp to npm when a version tag is pushed:
#   npm version patch && git push --follow-tags
#
# Uses npm trusted publishing: npm verifies this workflow's GitHub identity
# (OIDC), so no npm token is stored anywhere. Configured on npmjs.com under
# linework-mcp → Settings → Trusted Publisher (repo logcho/system-design,
# workflow release.yml). Packages get provenance attestations automatically.
on:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write # lets npm verify this workflow run

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
      # Trusted publishing needs npm 11.5.1 or newer.
      - run: npm install -g npm@11
      - run: npm ci

      - name: Check the tag matches package.json
        id: version
        run: |
          version="$(node -p "require('./package.json').version")"
          test "v${version}" = "${GITHUB_REF_NAME}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          if npm view "linework-mcp@${version}" version >/dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "::notice::linework-mcp@${version} is already on npm; nothing to publish."
          fi

      # prepublishOnly builds and tests before anything is uploaded.
      - if: steps.version.outputs.published != 'true'
        run: npm publish --access public
