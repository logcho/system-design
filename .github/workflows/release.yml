name: Release

# Stages a release of linework-mcp on npm when a version tag is pushed:
#   npm version patch && git push --follow-tags     (from main)
# or by hand for an existing tag: Actions → Release → Run workflow → tag.
#
# A staged version is not public until a maintainer approves it with 2FA:
#   npm stage list linework-mcp
#   npm stage approve <stage-id>
# (or approve it on npmjs.com). So nothing reaches users without a person.
#
# Uses npm trusted publishing: npm verifies this workflow's GitHub identity
# (OIDC), so no npm token is stored anywhere. Configured on npmjs.com under
# linework-mcp → Settings → Trusted Publisher (repo logcho/system-design,
# workflow release.yml, permission "stage publish"). Provenance is automatic.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing version tag to publish, e.g. v0.1.1'
        required: true

permissions:
  contents: read
  id-token: write # lets npm verify this workflow run

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
      # No registry-url here: it would write a placeholder auth token to .npmrc,
      # which npm can pick over the OIDC identity and then fail with a 404.
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          # This job can publish: don't restore a dependency cache another run could have written.
          package-manager-cache: false
      # Trusted publishing needs npm 11.5.1 or newer.
      - run: npm install -g npm@11 && npm --version
      - run: npm ci

      - name: Check the tag matches package.json
        id: version
        run: |
          version="$(node -p "require('./package.json').version")"
          test "v${version}" = "${TAG}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          if npm view "linework-mcp@${version}" version >/dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "::notice::linework-mcp@${version} is already on npm; nothing to publish."
          fi

      # prepublishOnly builds and tests before anything is uploaded. Verbose
      # logs show whether npm accepted the OIDC identity if staging fails.
      - name: Stage the release on npm
        if: steps.version.outputs.published != 'true'
        run: npm stage publish --access public --loglevel verbose

      - name: Explain how to approve
        if: steps.version.outputs.published != 'true'
        run: >-
          echo "::notice::linework-mcp@${{ steps.version.outputs.version }} is staged on npm.
          Approve it with 'npm stage list linework-mcp' then 'npm stage approve <stage-id>', or on npmjs.com."
